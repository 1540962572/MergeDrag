[package]
name = "git-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Git integration for MergeDrag (scan unmerged files, register mergetool)"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
git2 = "0.20"

[dev-dependencies]
tempfile = "3"
merge-core = { workspace = true }